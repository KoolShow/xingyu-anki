name: Update xingyu submodule

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-xingyu-submodule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: true

      - name: Update submodule to upstream HEAD
        run: git submodule update --remote --merge vendor/xingyu

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- vendor/xingyu; then
            echo "No submodule update."
            exit 0
          fi
          sha=$(git -C vendor/xingyu rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/xingyu
          git commit -m "chore: update xingyu submodule to ${sha}"
          git push
