name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update xingyu submodule"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run deck

      - name: Assemble site
        run: |
          mkdir -p _site/vendor/xingyu/data
          cp index.html _site/
          cp -r dist _site/dist
          cp vendor/xingyu/data/xingyu.json _site/vendor/xingyu/data/
          cp vendor/xingyu/data/Xingyu-VF.ttf _site/vendor/xingyu/data/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
