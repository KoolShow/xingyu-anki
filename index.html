<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>外星来信 Anki</title>
  </head>
  <body>
    <h1>外星来信 Anki</h1>
    <p>建议完成此游戏的全部字典后再使用，当心剧透。禁止二次分发产物！</p>
    <p>
      <label>上传存档（可选，.sav / .json）：<input id="save" type="file" accept="*/*" /></label>
    </p>
    <p>
      <label><input id="external" type="checkbox" /> 使用外部数据</label>
    </p>
    <button id="build" type="button">生成并下载 .apkg</button>
    <p id="status"></p>
    <script type="module" src="./dist/web.js"></script>
  </body>
</html>
